name: Frontend CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-verify:
    name: Production Vite Compilation & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Frontend Tests
        run: npm test

      - name: Run Vite Build
        run: npm run build
        env:
          VITE_API_URL: /api

  docker-build:
    name: Frontend Nginx Container Build Verification
    runs-on: ubuntu-latest
    needs: build-verify

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Without Publishing)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: netfil-frontend:test
